<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#0D1117"/>
<title>ARISE - Discipline Reset</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"><\/script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{width:100%;min-height:100dvh;overflow-x:hidden;font-family:'Inter',sans-serif;background:#0D1117;color:#e8edf5;-webkit-text-size-adjust:100%}
:root{
  --bg:#0D1117;--bg2:#111820;--bg3:#161d27;--card:#1a2232;--card2:#1f2a3c;
  --amber:#F5A623;--amber2:#e8971a;--aglow:rgba(245,166,35,0.15);
  --green:#2ecc71;--gdim:rgba(46,204,113,0.08);--gmid:rgba(46,204,113,0.22);
  --red:#e74c3c;--rdim:rgba(231,76,60,0.09);
  --t:#e8edf5;--t2:#8899aa;--t3:#55667a;
  --br:rgba(255,255,255,0.07);--br2:rgba(255,255,255,0.12);
  --r:16px;--rs:10px;--sh:0 2px 12px rgba(0,0,0,0.4);--shl:0 8px 40px rgba(0,0,0,0.55);
}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--card2);border-radius:2px}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:52px 16px 12px;max-width:480px;margin:0 auto;position:sticky;top:0;background:linear-gradient(180deg,rgba(9,13,18,0.99) 80%,transparent);z-index:100;border-bottom:1px solid var(--br)}
.t-day{font-family:'DM Mono',monospace;font-size:9px;color:var(--amber);letter-spacing:.2em;text-transform:uppercase;margin-bottom:2px}
.t-date{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;color:var(--t)}
.spill{display:flex;align-items:center;gap:6px;background:var(--aglow);border:1px solid rgba(245,166,35,0.3);border-radius:50px;padding:7px 14px;font-family:'DM Mono',monospace;font-size:10px;color:var(--amber);letter-spacing:.06em;position:relative;overflow:hidden;white-space:nowrap}
.spill::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(245,166,35,0.1),transparent);transform:translateX(-100%);animation:sh2 3s infinite}
@keyframes sh2{100%{transform:translateX(200%)}}
.flame{animation:fl 1.6s ease-in-out infinite alternate;display:inline-block}
@keyframes fl{0%{transform:scale(1) rotate(-2deg)}100%{transform:scale(1.15) rotate(2deg)}}
.tabs{display:flex;gap:3px;padding:8px 14px 0;max-width:480px;margin:0 auto;overflow-x:auto;scrollbar-width:none;background:rgba(13,17,23,0.98);border-bottom:1px solid var(--br);position:sticky;top:87px;z-index:99}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:8px 13px;border-radius:8px 8px 0 0;background:none;border:1px solid transparent;border-bottom:none;margin-bottom:-1px;font-size:10px;font-weight:600;color:var(--t3);cursor:pointer;transition:all .18s;font-family:'DM Mono',monospace;letter-spacing:.1em;text-transform:uppercase}
.tab.on{color:var(--amber);background:var(--card);border-color:var(--br)}
.tab:active{transform:scale(0.95)}
.page{display:none}.page.on{display:block}
.wrap{max-width:480px;margin:0 auto;padding:16px 14px 100px}
.hero{background:linear-gradient(135deg,#0f1c2e,#0a1118);border:1px solid rgba(245,166,35,0.13);border-radius:var(--r);padding:22px;margin-bottom:14px;position:relative;overflow:hidden;box-shadow:var(--shl)}
.hero::before{content:'';position:absolute;top:-70px;right:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(245,166,35,0.09) 0%,transparent 70%);pointer-events:none}
.h-eye{font-family:'DM Mono',monospace;font-size:8px;color:var(--amber);letter-spacing:.2em;margin-bottom:10px;text-transform:uppercase;position:relative}
.h-title{font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:700;color:var(--t);line-height:1.15;margin-bottom:18px;position:relative}
.h-title em{color:var(--amber);font-style:italic}
.h-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,0.04);border-radius:10px;overflow:hidden;position:relative}
.hcell{background:rgba(0,0,0,0.38);padding:14px 6px;text-align:center}
.hcell-n{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;color:var(--amber);line-height:1}
.hcell-l{font-family:'DM Mono',monospace;font-size:7px;color:var(--t3);letter-spacing:.14em;margin-top:4px;text-transform:uppercase}
.qcard{background:linear-gradient(135deg,#1a3d2a,#0f2318);border:1px solid var(--gmid);border-radius:var(--r);padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
.qcard::before{content:'"';position:absolute;top:-12px;left:8px;font-size:110px;color:rgba(46,204,113,0.06);font-family:'Space Grotesk',sans-serif;line-height:1;pointer-events:none}
.q-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.q-eye{font-family:'DM Mono',monospace;font-size:8px;color:var(--green);letter-spacing:.2em;text-transform:uppercase}
.q-refresh{background:rgba(46,204,113,0.1);border:1px solid rgba(46,204,113,0.2);border-radius:6px;color:var(--green);cursor:pointer;padding:4px 10px;font-size:11px;font-family:'Space Grotesk',sans-serif;font-weight:600;transition:all .2s}
.q-text{font-size:14px;color:#b8f0d0;line-height:1.65;font-style:italic;min-height:48px;position:relative}
.q-meta{margin-top:10px;font-size:10px;color:rgba(46,204,113,0.4);letter-spacing:.06em}
.pbox{background:var(--gdim);border:1px solid var(--gmid);border-left:3px solid var(--green);border-radius:var(--r);padding:16px 18px;margin-bottom:14px}
.p-eye{font-family:'DM Mono',monospace;font-size:8px;color:var(--green);letter-spacing:.2em;margin-bottom:7px;text-transform:uppercase}
.p-q{font-size:14px;color:#b8f0d0;line-height:1.65;font-style:italic}
.sec{display:flex;justify-content:space-between;align-items:center;margin:18px 0 10px}
.sec-l{font-family:'DM Mono',monospace;font-size:9px;font-weight:500;letter-spacing:.18em;color:var(--t3);text-transform:uppercase}
.sec-r{font-size:12px;color:var(--amber);font-weight:600;font-family:'Space Grotesk',sans-serif}
.dsum{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--card);border:1px solid var(--br);border-radius:var(--rs);margin-bottom:10px;box-shadow:var(--sh)}
.dsum-bg{flex:1;height:4px;background:var(--bg3);border-radius:99px;overflow:hidden}
.dsum-f{height:100%;border-radius:99px;transition:width .5s cubic-bezier(.34,1.56,.64,1)}
.dsum-pct{font-family:'DM Mono',monospace;font-size:11px;color:var(--t2);white-space:nowrap;min-width:34px;text-align:right}
.dsum-l{font-size:11px;color:var(--t3);white-space:nowrap}
.gcrd{background:var(--card);border:1px solid var(--br);border-radius:var(--r);overflow:hidden;margin-bottom:14px;box-shadow:var(--sh)}
.gh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;cursor:pointer;user-select:none}
.gt{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.14em;color:var(--t3);text-transform:uppercase}
.gtog{font-size:11px;color:var(--amber);background:none;border:none;cursor:pointer;font-family:'Space Grotesk',sans-serif;font-weight:600}
.gbody{padding:0 14px;overflow:hidden;max-height:0;opacity:0;transition:max-height .4s ease,opacity .3s,padding .3s}
.gbody.exp{max-height:180px;opacity:1;padding-bottom:14px}
.gbars{display:flex;align-items:flex-end;gap:4px;height:100px}
.bwrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end}
.bar{width:100%;background:linear-gradient(180deg,var(--amber),var(--amber2));border-radius:4px 4px 0 0;min-height:3px;transition:height .5s ease}
.bar.tb{box-shadow:0 0 12px rgba(245,166,35,0.4)}
.blbl{font-size:8px;color:var(--t3);text-align:center;font-family:'DM Mono',monospace}
.bpct{font-size:8px;color:var(--t3);font-family:'DM Mono',monospace}
.hlist{display:flex;flex-direction:column;gap:7px}
.habit{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--br);border-radius:var(--r);padding:13px 15px;cursor:pointer;transition:all .18s;user-select:none;box-shadow:var(--sh)}
.habit:active{transform:scale(0.985)}
.habit.done{background:rgba(46,204,113,0.07);border-color:var(--gmid)}
.habit.missed{background:var(--rdim);border-color:rgba(231,76,60,0.2);opacity:.8}
.hck{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--t3);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .18s}
.habit.done .hck{background:var(--green);border-color:var(--green);box-shadow:0 0 10px rgba(46,204,113,0.3)}
.habit.missed .hck{background:var(--rdim);border-color:var(--red)}
.tick{width:11px;height:11px;opacity:0;transition:opacity .15s}
.habit.done .tick{opacity:1}
.mx{font-size:11px;color:var(--red);opacity:0;font-weight:700}
.habit.missed .mx{opacity:1}
.hb{flex:1;min-width:0}
.hn{font-size:14px;font-weight:600;color:var(--t);font-family:'Space Grotesk',sans-serif;transition:color .18s}
.habit.done .hn{color:var(--green)}
.habit.missed .hn{color:var(--red);text-decoration:line-through;opacity:.7}
.hsub{font-size:11px;color:var(--t3);margin-top:2px}
.hnum{font-family:'DM Mono',monospace;font-size:9px;color:var(--t3);flex-shrink:0}
.habit.done .hnum{color:var(--green)}
.movly{position:fixed;inset:0;background:rgba(0,0,0,0.82);z-index:200;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(6px)}
.movly.open{display:flex}
.mbox{background:var(--card);border-radius:22px 22px 0 0;border-top:1px solid var(--br);padding:26px 20px 44px;width:100%;max-width:480px;max-height:88dvh;overflow-y:auto;box-shadow:0 -8px 60px rgba(0,0,0,0.5)}
.mhand{width:36px;height:3px;background:var(--br2);border-radius:99px;margin:0 auto 20px}
.mtitle{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;color:var(--t);margin-bottom:6px}
.msub{font-size:13px;color:var(--t2);line-height:1.65;margin-bottom:16px}
.mq{font-family:'DM Mono',monospace;font-size:9px;color:var(--t3);margin:14px 0 6px;letter-spacing:.12em;text-transform:uppercase}
.mta{width:100%;min-height:68px;border:1px solid var(--br2);border-radius:var(--rs);padding:12px 14px;font-size:13px;font-family:'Inter',sans-serif;background:var(--bg3);color:var(--t);outline:none;resize:vertical;line-height:1.6;transition:border-color .2s}
.mta:focus{border-color:var(--red)}
.mrow{display:flex;gap:10px;margin-top:18px}
.mcancel{flex:1;padding:13px;background:var(--bg3);color:var(--t2);border:none;border-radius:var(--rs);font-size:13px;font-family:'Space Grotesk',sans-serif;font-weight:600;cursor:pointer}
.mconfirm{flex:2;padding:13px;background:var(--red);color:#fff;border:none;border-radius:var(--rs);font-size:13px;font-family:'Space Grotesk',sans-serif;font-weight:600;cursor:pointer}
.rbtn{display:block;width:100%;padding:14px;background:rgba(231,76,60,0.06);color:var(--red);border:1.5px dashed rgba(231,76,60,0.35);border-radius:var(--r);font-size:13px;font-family:'Space Grotesk',sans-serif;font-weight:600;cursor:pointer;text-align:center;margin-top:8px;transition:all .2s}
.rlogged{display:none;background:rgba(231,76,60,0.05);border:1px solid rgba(231,76,60,0.2);border-radius:var(--r);padding:14px 16px;margin-bottom:8px}
.rlogged.show{display:block}
.rl-l{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:.18em;color:var(--red);margin-bottom:6px;text-transform:uppercase}
.rl-t{font-size:13px;color:var(--t2);line-height:1.55}
.logbtn{display:block;width:100%;padding:17px;background:var(--card2);color:var(--t);border:1px solid var(--br);border-radius:var(--r);font-size:15px;font-family:'Space Grotesk',sans-serif;font-weight:700;cursor:pointer;margin-top:18px;transition:all .25s;letter-spacing:.04em;box-shadow:var(--shl)}
.logbtn.won{background:linear-gradient(135deg,#1a4a2e,#1e5c36);color:var(--green);border-color:rgba(46,204,113,0.3)}
.logbtn:disabled{opacity:.4;cursor:not-allowed}
.ccrd{background:var(--card);border:1px solid var(--br);border-radius:var(--r);padding:18px;margin-top:14px;box-shadow:var(--sh)}
.cc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cc-t{font-size:13px;font-weight:600;color:var(--t);font-family:'Space Grotesk',sans-serif}
.cc-pct{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:var(--green)}
.bb{height:4px;background:var(--bg3);border-radius:99px;overflow:hidden;margin-bottom:14px}
.bf{height:100%;background:linear-gradient(90deg,var(--green),#00dea8);border-radius:99px;transition:width .6s cubic-bezier(.34,1.56,.64,1)}
.crow{display:flex;gap:8px}
.cinp{flex:1;height:42px;border:1px solid var(--br2);border-radius:var(--rs);padding:0 14px;font-size:14px;font-family:'Inter',sans-serif;background:var(--bg3);color:var(--t);outline:none;transition:border-color .2s}
.cinp:focus{border-color:var(--green)}
.cbtn{height:42px;padding:0 18px;background:var(--green);color:#0a0a0a;border:none;border-radius:var(--rs);font-size:13px;font-family:'Space Grotesk',sans-serif;font-weight:700;cursor:pointer}
.cmeta{font-family:'DM Mono',monospace;font-size:10px;color:var(--t3);margin-top:10px;letter-spacing:.04em}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.cd{aspect-ratio:1;border-radius:7px;background:var(--card2);transition:all .2s}
.cd.win{background:var(--green);box-shadow:0 2px 8px rgba(46,204,113,0.28)}
.cd.partial{background:rgba(46,204,113,0.28)}
.cd.relapsed{background:var(--red);box-shadow:0 2px 8px rgba(231,76,60,0.28)}
.cd.cur{background:transparent;border:2px solid var(--amber)}
.leg-row{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap}
.leg-i{display:flex;align-items:center;gap:5px;font-family:'DM Mono',monospace;font-size:9px;color:var(--t3);letter-spacing:.06em}
.leg-d{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.gwrap{background:var(--card);border:1px solid var(--br);border-radius:var(--r);padding:18px;margin-bottom:12px;box-shadow:var(--sh)}
.gwtitle{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.14em;color:var(--t3);margin-bottom:14px;text-transform:uppercase}
.hbrow{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1px solid var(--br);border-radius:12px;margin-bottom:6px;box-shadow:var(--sh)}
.tblock{background:var(--card);border:1px solid var(--br);border-radius:var(--r);padding:16px;margin-bottom:8px;box-shadow:var(--sh)}
.tbh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.tbd{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.tbl{font-family:'DM Mono',monospace;font-size:9px;font-weight:500;letter-spacing:.18em;color:var(--t2);text-transform:uppercase}
.tbc{font-family:'DM Mono',monospace;font-size:9px;color:var(--t3);margin-left:auto}
.todos{display:flex;flex-direction:column;gap:5px}
.tdrow{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg3);border-radius:9px}
.tdcb{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--br2);background:var(--card);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.tdcb.chk{background:var(--green);border-color:var(--green)}
.tdtxt{flex:1;font-size:12px;color:var(--t);font-family:'Space Grotesk',sans-serif;font-weight:500}
.tddel{font-size:11px;color:var(--t3);cursor:pointer;padding:0 4px;background:none;border:none;transition:color .2s}
.tddel:hover{color:var(--red)}
.addrow{display:flex;gap:6px;margin-top:10px}
.addinp{flex:1;height:38px;border:1px solid var(--br2);border-radius:9px;padding:0 12px;font-size:12px;font-family:'Inter',sans-serif;background:var(--bg3);color:var(--t);outline:none;transition:border-color .2s}
.addinp:focus{border-color:var(--green)}
.addbtn{height:38px;width:38px;background:var(--green);color:#0a0a0a;border:none;border-radius:9px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.addbtn:active{opacity:.8;transform:scale(0.92)}
.tcrd{background:var(--card);border:1px solid var(--br);border-radius:var(--r);padding:18px;margin-bottom:10px;box-shadow:var(--sh)}
.thead2{display:flex;align-items:flex-start;gap:14px}
.tico{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}
.tttl{font-size:14px;font-weight:700;color:var(--t);margin-bottom:4px;font-family:'Space Grotesk',sans-serif}
.tsub{font-size:12px;color:var(--t2);line-height:1.6}
.tact{margin-top:12px;padding:12px 14px;background:var(--gdim);border-radius:9px;border-left:2.5px solid var(--green)}
.tactl{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:.16em;color:var(--green);margin-bottom:5px;text-transform:uppercase}
.tactt{font-size:12px;color:var(--t);line-height:1.55}
.ubtn{display:block;width:100%;padding:17px;background:var(--red);color:#fff;border:none;border-radius:var(--r);font-size:14px;font-family:'Space Grotesk',sans-serif;font-weight:700;cursor:pointer;margin-bottom:12px;transition:all .2s;box-shadow:0 4px 20px rgba(231,76,60,0.3)}
.ubtn:active{opacity:.85;transform:scale(0.98)}
.usteps{display:none;flex-direction:column;gap:6px;margin-bottom:14px}
.usteps.open{display:flex}
.ustep{display:flex;align-items:flex-start;gap:12px;background:var(--card);border:1px solid var(--br);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.unum{width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;font-family:'DM Mono',monospace;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.utitle{font-size:13px;font-weight:700;color:var(--t);font-family:'Space Grotesk',sans-serif}
.usub{font-size:11px;color:var(--t3);margin-top:2px}
.timerbtn{width:100%;padding:14px;background:var(--card);border:1.5px solid var(--green);border-radius:12px;color:var(--green);font-size:13px;font-family:'Space Grotesk',sans-serif;font-weight:700;cursor:pointer;transition:all .2s}
.timerbtn.running{background:var(--green);color:#0a0a0a}
.rvcrd{background:var(--card);border:1px solid var(--br);border-radius:var(--r);padding:18px;margin-bottom:10px;box-shadow:var(--sh)}
.rvlbl{font-size:14px;font-weight:700;color:var(--t);margin-bottom:12px;font-family:'Space Grotesk',sans-serif}
.rvscore{display:flex;gap:5px;margin:0 0 14px;flex-wrap:wrap}
.sdot{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--br2);background:var(--bg3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:11px;font-weight:600;color:var(--t3);transition:all .18s;flex-shrink:0}
.sdot.sel{background:var(--green);border-color:var(--green);color:#0a0a0a;box-shadow:0 0 10px rgba(46,204,113,0.3)}
.rvq{font-family:'DM Mono',monospace;font-size:9px;color:var(--t3);margin:12px 0 6px;letter-spacing:.12em;text-transform:uppercase}
.rvta{width:100%;min-height:72px;border:1px solid var(--br2);border-radius:var(--rs);padding:12px 14px;font-size:13px;font-family:'Inter',sans-serif;background:var(--bg3);color:var(--t);outline:none;resize:vertical;line-height:1.6;transition:border-color .2s}
.rvta:focus{border-color:var(--green)}
.rvsave{width:100%;padding:13px;background:var(--green);color:#0a0a0a;border:none;border-radius:var(--rs);font-size:13px;font-family:'Space Grotesk',sans-serif;font-weight:700;cursor:pointer;margin-top:12px}
.sunbanner{background:var(--gdim);border:1px solid var(--gmid);border-radius:var(--r);padding:14px 16px;margin-bottom:14px;display:none}
.sunbanner.show{display:block}

<script>
const JEND='2026-12-31';
const KEY='arise_v4';
const PROMPTS=["Nobody in church is watching you. They're fighting their own silent war. What would you do today if you truly believed that?","You said you're full of surprises. Name one thing you've been hiding from yourself that you're actually capable of.","What's one fear you've been calling 'being realistic'?","If the version of you from 6 months ahead came back, what's the first thing he'd tell you to stop doing?","What does the man you want to become do at 2pm when he's bored and alone?","You've relapsed. You've restarted. What does that tell you about who you actually are?","Discipline isn't motivation. What's one thing you can do today that doesn't require feeling ready?","What are you escaping when you pick up your phone with no purpose?","A slip is not a slide. You logged it. You're back. What's the very next small action?","The man you're becoming doesn't need a perfect past. He just needs the next right move.","Paul said 'I do what I don't want to do.' He still wrote most of the New Testament. What does that tell you?","Shame wants you to hide. Accountability wants you to grow. Which one are you choosing today?","Your trembling hand held a pen in school. What did it draw? That was still you.","The moringa is growing in your yard. What else is right in front of you that you're not using?","When you are alone and calm, you are exactly who you want to be. What would it mean to bring that person into the world?","Fifty push-ups a day is not exercise. It is a man speaking to his own body: I am not done becoming.","What would change tomorrow if you slept before midnight every night for 30 days?","God said the fruit is for you. What else has He put in your environment that you haven't used yet?"];
const HABITS=[{id:'prayer',n:'Prayer / quiet reflection',s:'Set your mind before the day'},{id:'pushups',n:'50 push-ups',s:"You've done 60. This is easy for you now."},{id:'reading',n:'10 pages',s:'Any book that builds you'},{id:'journal',n:'10 min journaling',s:"Write it, don't just think it"},{id:'reflect',n:'10 min reflection',s:'Quiet. No phone. Just you.'},{id:'study',n:'Skill study / Shopify',s:'30 min — anything that compounds'},{id:'noporn',n:'No porn · No M',s:'The one that matters most tonight'}];
const BLOCKS=[{id:'morning',label:'MORNING',color:'#F5A623',tasks:['Wake up at same time','Prayer / quiet reflection','Cold shower or cold water on face','50 push-ups']},{id:'midday',label:'MIDDAY',color:'#2ecc71',tasks:['Work / learning session','Shopify course (30 min)','Moringa + turmeric (food or tea)']},{id:'evening',label:'EVENING',color:'#5B7FE8',tasks:['Reading (10 pages)','10 min journaling','10 min reflection','Eat fruit']},{id:'night',label:'NIGHT',color:'#8B5CF6',tasks:['Wash face + moisturize','Screens off 30 min before bed','Sleep before midnight']}];
const SPIRITUAL=[{phase:1,passages:[{id:'gen1',ref:'Genesis 1-3',note:'Where you came from + why everything feels broken'},{id:'ps139',ref:'Psalm 139',note:'You are not random, you are designed'},{id:'jer1',ref:'Jeremiah 1:4-10',note:'Purpose before birth'},{id:'eph1',ref:'Ephesians 1',note:'Your identity in Christ — read slowly'},{id:'1pet2',ref:'1 Peter 2:9',note:'Who you are now'}]},{phase:2,passages:[{id:'2tim1',ref:'2 Timothy 1:7',note:'You quoted it — now understand it'},{id:'phil4',ref:'Philippians 4:4-9',note:'The practical system to kill anxiety'},{id:'isa41',ref:'Isaiah 41:10',note:"God's response to fear"},{id:'rom12',ref:'Romans 12:1-2',note:'Transformation happens in the mind'},{id:'ps23',ref:'Psalm 23',note:'Security, not hype'}]},{phase:3,passages:[{id:'mat6',ref:'Matthew 6:25-33',note:'Seek first... not results first'},{id:'luk10',ref:'Luke 10:38-42',note:'Martha vs Mary — doing vs being'},{id:'joh15',ref:'John 15',note:'Connection to the source'},{id:'hos6',ref:'Hosea 6:6',note:'God wants relationship, not empty actions'},{id:'mat7',ref:'Matthew 7:21-23',note:'The warning — read it carefully'}]},{phase:4,passages:[{id:'gal5',ref:'Galatians 5:16-26',note:'The war inside you'},{id:'rom7',ref:'Romans 7',note:"Paul himself struggled — you're not crazy"},{id:'rom8',ref:'Romans 8',note:'Victory over that struggle'},{id:'col3',ref:'Colossians 3',note:'Practical way to live it out'}]}];
const MCATS={fear:{label:'Fear & Anxiety',color:'#5B7FE8',dot:'#5B7FE8'},identity:{label:'Identity',color:'#F5A623',dot:'#F5A623'},rewire:{label:'Body & Brain',color:'#2ecc71',dot:'#2ecc71'},bounce:{label:'Bounce Back',color:'#e74c3c',dot:'#e74c3c'},consistency:{label:'Consistency',color:'#8B5CF6',dot:'#8B5CF6'}};
const MT=[{id:'m1',cat:'fear',title:"Your fear is not a personality flaw.",truth:"You didn't 'become weak.' Your nervous system was trained over years to associate being seen with danger. It learned: attention = threat, speaking = embarrassment. So it protects you by shutting you down. That shaking, that blank mind? Your system doing its job too well. It's not you failing. It's conditioning.",reflect:"What's one specific moment from the past that taught your body being seen is dangerous? Name it."},{id:'m2',cat:'fear',title:"You can't think your way out of a feeling your body learned.",truth:"The fear doesn't live in your logic. It lives in your nervous system. That's why 'I know I'm safe' doesn't stop the shaking. Your thinking brain can know you're fine. Your survival brain doesn't care — it fires before you can think. You don't fight it. You retrain it through repetition.",reflect:"Next time fear hits, instead of arguing with it — what if you just said: 'Yeah, I expected you.' How does that change things?"},{id:'m3',cat:'rewire',title:"Your brain has two systems. Only one listens to you.",truth:"Thinking brain: logic, intention — 'I'm safe.' Survival brain: automatic, faster than thought. When you're exposed, the survival system takes over. Heart races. Hands shake. Mind blanks. That system doesn't ask for permission. You don't beat it by willpower. You train it the same way it was trained against you — through repetition.",reflect:"What's one small daily action that would start feeding the survival brain new evidence that you're safe?"},{id:'m4',cat:'rewire',title:"Porn doesn't just affect your urges. It rewires your baseline.",truth:"Years of compulsive use trains the brain toward easy dopamine. Real-world effort becomes harder. Anxiety increases because the brain constantly expects a shortcut. Confidence erodes not from laziness — but from a nervous system accustomed to reward without discomfort. You can't fix confidence while feeding that loop daily.",reflect:"What's one thing in your real life that got harder to enjoy because the brain got used to something easier?"},{id:'m5',cat:'identity',title:"You are not the version of you that's been conditioned.",truth:"The version of you that hides, shakes, and goes quiet — that's a trained response, not your identity. The fact that you speak well in private, think clearly, and want change proves the real version is already there. It's just buried under conditioning and habits. You are not broken. You are untrained.",reflect:"Who were you before you learned to make yourself small? What do you remember about that version?"},{id:'m6',cat:'identity',title:"Being seen is not the same as being judged.",truth:"Your brain learned to treat visibility as a threat. Most people are too caught up in their own inner noise to scrutinize you the way you fear. The judgment you're hiding from mostly exists inside you, not outside. The audience isn't as large or as harsh as your nervous system believes.",reflect:"Think of the last time you judged someone harshly just for existing in a room. Did that actually happen?"},{id:'m7',cat:'bounce',title:"A slip is data, not a verdict.",truth:"Every relapse, every missed day — it's not proof that you're weak. It's information. What was happening before it? What time of day? What emotion? What trigger? The person who logs it honestly and asks those questions is further along than the person who pretends it didn't happen.",reflect:"What pattern do you notice about when you slip? Be specific — time, mood, what preceded it."},{id:'m8',cat:'bounce',title:"Paul said: I do what I don't want to do. He still wrote most of the New Testament.",truth:"Romans 7 is Paul describing his own internal war — doing the thing he hates, not doing the thing he loves. He didn't resolve it through willpower. He resolved it through identity shift. He named it. He got back up. He didn't let the struggle define his output.",reflect:"What would change if you stopped seeing your struggle as your identity and started seeing it as just the war — one you're still fighting?"},{id:'m9',cat:'bounce',title:"The man who falls and gets back up is stronger than the man who never fell.",truth:"Every reset builds resilience if you use it right. The fall is not the end of the story — the return is. What makes a man is not whether he stayed clean for 6 months straight. It's whether, after the slip at 3am, he woke up the next morning and did the first habit anyway. That's character.",reflect:"After your last slip, how fast did you get back up? What could you do to make that window shorter next time?"},{id:'m10',cat:'consistency',title:"Confidence comes after the reps. Not before.",truth:"You're waiting to feel ready before you act. That's the trap. Confidence is the result of doing the thing you were afraid of, enough times, and surviving it. The feeling follows the action — never the other way. The man waiting to feel ready will wait forever.",reflect:"Name one thing you've been postponing until you feel ready. What's the smallest possible version you could do today?"},{id:'m11',cat:'consistency',title:"Motivation is a guest. Discipline is the house.",truth:"You can't build anything on motivation because motivation leaves whenever it wants. It depends on mood, sleep, circumstances. Discipline is what runs the system when motivation is gone. The days you don't feel it and show up anyway are the ones that build the most.",reflect:"What's one habit you'd do today even if you felt terrible? That's where your real foundation is."},{id:'m12',cat:'rewire',title:"The wiring can be changed. Not by decision — by reps.",truth:"Exposure isn't about not feeling fear. It's about staying in the discomfort long enough for your brain to update: 'Nothing bad happened.' At first 100% fear. After reps: 70% to 40% to 10%. Eventually the trigger doesn't fire the same way. Not because you decided to be calm. Because your brain accumulated enough evidence.",reflect:"Think about one thing you're already not afraid of that you once were. How did that shift happen?"},{id:'m13',cat:'identity',title:"You can't hate yourself into becoming someone better.",truth:"Self-criticism feels productive because it's intense. But intensity is not the same as effectiveness. Self-compassion after failure leads to more effort and fewer future slips than self-punishment does. The internal voice that calls you weak is not your coach. It's the same system trying to keep you small.",reflect:"What would you tell a close friend who was going through exactly what you're going through right now?"},{id:'m14',cat:'consistency',title:"The reps you do when nobody is watching are the ones that change you.",truth:"Nobody will see you pray at 6am. Nobody will see you put the phone down and pick up a book. Nobody will see you do the 50 push-ups when you're exhausted. But your nervous system sees every rep. Your brain records every time you chose the harder thing. Character is built in private.",reflect:"What's one thing you do consistently in private that the best version of you would do? Build on that."},{id:'m15',cat:'fear',title:"Shame wants you to hide. Growth wants you to show up.",truth:"After a slip, shame says: stay quiet, disappear, you don't deserve to be here. That voice is a liar. Shame keeps the loop running by isolating you. Growth says: log it, name it, show up the next morning, do the first habit anyway. The antidote to shame isn't perfection. It's accountability followed by action.",reflect:"What does shame usually tell you to do after a hard day? What would accountability tell you to do instead?"},{id:'m16',cat:'rewire',title:"Your brain is not fixed. It is always updating.",truth:"Every time you avoid, the avoidance pathway gets stronger. Every time you stay in the discomfort, the 'nothing bad happened' pathway gets built. You are not locked into who you are today. You are building tomorrow's default responses right now with every decision you make.",reflect:"What is one thing you've already changed about yourself in the last few years — proof that your brain updates?"},{id:'m17',cat:'bounce',title:"You don't need a perfect past. You need the next right move.",truth:"The idea that you have to start clean to matter is a trap. The slate doesn't need to be blank for today to count. You relapsed yesterday and did 5 habits today? That is the story of a man becoming. Progress is not a straight line. It's a direction. Stay pointed the right way.",reflect:"If this week didn't count toward anything, what would you do differently? Now ask yourself why it actually does count."},{id:'m18',cat:'identity',title:"The trembling hand is not the whole story.",truth:"They called you 'vibrator.' Children mock what they don't understand. But biology is not morality. A nervous system more sensitive than average picks up more — more emotion, more awareness, more creativity. The same wiring that shakes in crowds is the wiring that makes you feel things deeply. That is not a defect. That is design.",reflect:"What has your sensitivity allowed you to notice, feel, or understand that others might have missed?"},{id:'m19',cat:'consistency',title:"Small and daily beats big and occasional every time.",truth:"Your brain changes through frequency, not intensity. One massive effort every two weeks builds less than one small rep every day. The body learns through repetition — not episodes. These habits aren't goals. They're reps on a machine that rewires you.",reflect:"What is one action so small that even on your worst day you could still do it? That's your non-negotiable."},{id:'m20',cat:'fear',title:"You are not escaping fear. You are training it.",truth:"The goal was never to become a person who feels no fear. The goal is to become a person who acts in spite of it, repeatedly, until the nervous system updates its threat assessment. Every time you show up shaking and do it anyway — you are not just surviving. You are training. The next rep will be 1% easier.",reflect:"What would it look like to treat your fear as a training partner, not an enemy?"}];
const FQ=["The tree that survives the storm has roots the storm cannot see. Your trembling hands hold more strength than those who never had to fight.","God planted moringa, turmeric, and soursop in your yard before you knew you needed them. He also planted the strength to overcome this before you knew you'd need it.","The boys who called you 'vibrator' were naming something they couldn't understand. You were always more sensitive to this world than they were — that is not weakness. That is design.","Your hand shakes because you feel more than most. Do not ask God to remove the sensitivity. Ask Him to show you what it was placed there to do.","Fifty push-ups a day is not exercise. It is a man speaking to his own body, saying: I am not done becoming.","The soil doesn't ask the seed why it's taking so long. It just holds it, feeds it, and waits. You are in the ground right now. This season is not failure. It is formation.","Six months from today, a man will look in the mirror and he will not be you — he will be who you chose to become. Choose today."];
function def(){return{wins:[],streak:0,totalMins:0,checked:[],todos:{morning:[],midday:[],evening:[],night:[]},habitMisses:{},habitDoneByDay:{},reviews:[],spRead:[],relapses:[],mindRead:[],mindExpanded:[],mindIdx:0,lastExport:null,lastCheckedDate:null}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'{}');return Object.assign(def(),d);}catch{return def();}}
function save(){localStorage.setItem(KEY,JSON.stringify(S));updBK();}
let S=load(),gExp=false,urgeOpen=false,tInt=null,tSecs=600,mFil='all';
const today=new Date().toISOString().slice(0,10);
function updBK(){const el=document.getElementById('bknote');if(el){const l=S.lastExport?new Date(S.lastExport).toLocaleDateString():'never';el.textContent='Last export: '+l+' \u00b7 Auto-saves on every tap.';}}
function autoClose(){if(!S.habitDoneByDay)S.habitDoneByDay={};const lcd=S.lastCheckedDate;if(lcd&&lcd!==today&&S.checked&&S.checked.length>0){S.habitDoneByDay[lcd]=S.checked.slice();S.checked=[];}S.lastCheckedDate=today;save();}
autoClose();
function nav(id,tab){document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));document.getElementById('pg-'+id).classList.add('on');tab.classList.add('on');if(id==='stats')renderStats();if(id==='plan')renderPlan();if(id==='review')renderReview();if(id==='mind')renderMind();}
function render(){
  const now=new Date();
  const DD=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const MM=['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('tday').textContent=DD[now.getDay()];
  document.getElementById('tdate').textContent=now.getDate()+' '+MM[now.getMonth()];
  const left=Math.max(0,Math.ceil((new Date(JEND+'T23:59:59')-now)/864e5));
  document.getElementById('hnl').textContent=left;
  document.getElementById('hns').textContent=S.streak||0;
  document.getElementById('hnw').textContent=S.wins.length;
  document.getElementById('snum').textContent=S.streak||0;
  document.getElementById('pq').textContent=PROMPTS[(now.getDate()+now.getMonth()*3)%PROMPTS.length];
  if(!S.checked)S.checked=[];
  renderHabits();renderTodayProg();renderTodayR();renderWeekG();
  const pct=Math.min(100,Math.round(((S.totalMins||0)/1080)*100));
  document.getElementById('cpct').textContent=pct+'%';
  document.getElementById('barf').style.width=pct+'%';
  document.getElementById('cmeta').textContent=(S.totalMins||0)+' / 1080 min \u00b7 '+Math.ceil(Math.max(0,1080-(S.totalMins||0))/60)+' hrs remaining';
  const won=S.wins.includes(today);const btn=document.getElementById('logbtn');
  btn.textContent=won?'Today logged \u2713':'Mark today complete';btn.disabled=won;
  won?btn.classList.add('won'):btn.classList.remove('won');
}
function renderTodayProg(){
  const done=S.checked.filter(id=>HABITS.find(h=>h.id===id)).length;
  const pct=Math.round((done/HABITS.length)*100);const wrap=document.getElementById('tdprog');
  if(done===0){wrap.innerHTML='';return;}
  const c=pct>=100?'var(--green)':pct>=50?'var(--amber)':'var(--red)';
  wrap.innerHTML=`<div class="dsum"><div class="dsum-l">${done} done</div><div class="dsum-bg"><div class="dsum-f" style="width:${pct}%;background:${c}"></div></div><div class="dsum-pct" style="color:${c}">${pct}%</div></div>`;
}
function renderHabits(){
  const list=document.getElementById('hlist');list.innerHTML='';let done=0;
  HABITS.forEach((h,i)=>{
    const isDone=S.checked.includes(h.id);const isMissed=(S.habitMisses||{})[today]&&S.habitMisses[today].includes(h.id);
    if(isDone)done++;const d=document.createElement('div');d.className='habit'+(isDone?' done':isMissed?' missed':'');d.dataset.id=h.id;d.onclick=()=>tog(d);
    d.innerHTML=`<div class="hck"><svg class="tick" viewBox="0 0 10 10" fill="none" stroke="#0a0a0a" stroke-width="2.5" width="11" height="11"><polyline points="1.5,5 4,7.5 8.5,2.5"/></svg><span class="mx">\u2715</span></div><div class="hb"><div class="hn">${h.n}</div><div class="hsub">${h.s}</div></div><div class="hnum">${String(i+1).padStart(2,'0')}</div>`;
    list.appendChild(d);
  });
  document.getElementById('hcount').textContent=done+' / '+HABITS.length;
}
function tog(el){
  const id=el.dataset.id;if(!S.checked)S.checked=[];if(!S.habitMisses)S.habitMisses={};
  const wc=S.checked.includes(id);const wm=(S.habitMisses[today]||[]).includes(id);
  if(!wc&&!wm){S.checked.push(id);}else if(wc){S.checked=S.checked.filter(x=>x!==id);if(!S.habitMisses[today])S.habitMisses[today]=[];S.habitMisses[today].push(id);}
  else{S.habitMisses[today]=S.habitMisses[today].filter(x=>x!==id);}
  save();renderHabits();renderTodayProg();renderWeekG();
}
function toggleG(){gExp=!gExp;document.getElementById('gbody').classList.toggle('exp',gExp);document.getElementById('gbtn').textContent=gExp?'Collapse \u25b4':'Expand \u25be';}
function renderWeekG(){
  const c=document.getElementById('gbars');const tot=HABITS.length;const days=[];
  for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=d.toISOString().slice(0,10);const h=S.habitDoneByDay&&S.habitDoneByDay[k]?S.habitDoneByDay[k]:(k===today?S.checked:[]);const done=HABITS.filter(x=>h.includes(x.id)).length;const pct=Math.round((done/tot)*100);days.push({pct,label:['S','M','T','W','T','F','S'][d.getDay()],isToday:i===0});}
  const mx=Math.max(...days.map(d=>d.pct),1);
  c.innerHTML=days.map(d=>{const h=d.pct>0?Math.max(Math.round((d.pct/mx)*88),6):3;return`<div class="bwrap"><div class="bpct">${d.pct>0?d.pct+'%':''}</div><div class="bar${d.isToday?' tb':''}" style="height:${h}px"></div><div class="blbl">${d.isToday?'\u25cf':d.label}</div></div>`;}).join('');
}
function openRM(){document.getElementById('mwhat').value='';document.getElementById('mnext').value='';document.getElementById('rmodal').classList.add('open');}
function closeRM(){document.getElementById('rmodal').classList.remove('open');}
function confirmR(){
  if(!S.relapses)S.relapses=[];const what=document.getElementById('mwhat').value.trim();const next=document.getElementById('mnext').value.trim();
  S.relapses=S.relapses.filter(r=>r.date!==today);S.relapses.push({date:today,what,next,habitsCompleted:S.checked.length,loggedAt:new Date().toISOString()});
  save();closeRM();renderTodayR();showToast('Logged. Get back up.');
}
function renderTodayR(){
  const tr=(S.relapses||[]).find(r=>r.date===today);const se=document.getElementById('rstatus');const btn=document.getElementById('rbtn');
  if(tr){btn.textContent="Update today's log";btn.style.borderStyle='solid';se.innerHTML=`<div class="rlogged show"><div class="rl-l">LOGGED TODAY</div>${tr.what?`<div class="rl-t">What happened: ${tr.what}</div>`:''} ${tr.next?`<div class="rl-t" style="margin-top:4px;color:var(--green)">Next time: ${tr.next}</div>`:''}<div class="rl-t" style="margin-top:8px;font-style:italic;color:var(--t3);font-size:12px">"The man who falls and gets up is stronger than the man who never fell."</div></div>`;}

}

Generate ONE daily quote for him. Rules:

Reply ONLY with the quote. No label, no author, no preamble.`;
